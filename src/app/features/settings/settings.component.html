
<mat-sidenav-container class="settings__container">
  <mat-sidenav mode="side" opened>
    <div class="settings__sidenav-header">
      <h2>{{ "sidenav.settings" | translate }}</h2>
    </div>
    <mat-divider ></mat-divider> 
    <!--
      Schemes and Trust Framework are intentionally absent: neither section is implemented,
      and their links led to a placeholder (schemes reused the issuance form) or straight out
      of Settings (TF pointed at /organization/credentials). Restore them with their sections.
    -->
    <mat-nav-list>
      @if (canSeeCatalog()) {
        <a mat-list-item
           routerLink="/settings/catalog"
           routerLinkActive="settings__nav-link--active"
           [routerLinkActiveOptions]="{ exact: true }"
           data-testid="nav-catalog">
           <div class="settings__nav-item">
            <mat-icon>category</mat-icon>
            <span>{{ "sidenav.catalog" | translate }}</span>
           </div>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>
