@let details = this.details();

@if (subtitleKey()) {
  <p class="issued-credential-summary__subtitle">{{ subtitleKey() | translate }}</p>
}

@if (hasKeySection()) {
  <p class="issued-credential-summary__key-warning">
    {{ "credentialIssuance.result.keyWarning" | translate }}
  </p>
}

@if (details.length > 0) {
  <dl class="issued-credential-summary__details">
    @for (row of details; track row.labelKey) {
      <div class="issued-credential-summary__detail">
        <dt>{{ row.labelKey | translate }}</dt>
        <dd>{{ row.value }}</dd>
      </div>
    }
  </dl>
}
