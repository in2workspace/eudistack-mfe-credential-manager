<div class="delivery-outcome-list">
  @for (entry of orderedEntries(); track entry.mode) {
    <section
      class="delivery-outcome-list__box"
      [class.delivery-outcome-list__box--delivered]="isDelivered(entry.outcome)"
      [class.delivery-outcome-list__box--failed]="!isDelivered(entry.outcome)">
      <h3 class="delivery-outcome-list__title">{{ entry.labelKey | translate }}</h3>
      <p class="delivery-outcome-list__body">
        <mat-icon aria-hidden="true">{{ isDelivered(entry.outcome) ? 'check_circle' : 'error' }}</mat-icon>
        <span>{{ bodyKeyFor(entry) | translate }}</span>
      </p>
    </section>
  }
</div>
