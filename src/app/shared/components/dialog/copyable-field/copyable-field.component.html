<div class="copyable-field">
  <span class="field-label">{{ labelKey() | translate }}</span>

  <div class="field-row">
    <input
      class="field-value"
      [type]="revealed() ? 'text' : 'password'"
      readonly
      [value]="value()"
      [attr.aria-label]="labelKey() | translate"
      spellcheck="false"
      autocomplete="off"
      data-lpignore="true"
    />

    <div class="field-actions">
      <button
        type="button"
        class="visibility-button"
        [attr.aria-label]="(revealed() ? 'dialog.hide' : 'dialog.show') | translate"
        (click)="toggleVisibility()"
      >
        <mat-icon aria-hidden="true">{{ revealed() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      <button
        type="button"
        class="copy-button"
        [attr.aria-label]="'dialog.copy' | translate"
        (click)="copy()"
      >
        <mat-icon aria-hidden="true">content_copy</mat-icon>
        <span>{{ "dialog.copy" | translate }}</span>
      </button>
    </div>
  </div>

  @if (hasCopied()) {
    <output class="copied-confirmation">
      <mat-icon aria-hidden="true">check</mat-icon>
      <span>{{ copiedLabelKey() | translate }}</span>
    </output>
  }
</div>
