@if (!isDismissed()) {
  <div class="alert-banner" role="status" aria-live="polite">
    <span class="alert-banner__message">{{ messageKey | translate }}</span>
    <button
      type="button"
      mat-icon-button
      class="alert-banner__dismiss"
      [attr.aria-label]="dismissLabelKey | translate"
      (click)="dismiss()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>
}
